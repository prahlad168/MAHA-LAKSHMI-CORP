services:
  - type: web
    name: mahalakshmi-backend
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT --log-level info
    healthCheckPath: /health
    envVars:
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: mahalakshmi_db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: mahalakshmi_redis
          type: redis
          property: connectionString
      - key: CORS_ORIGINS
        value: https://mahalaksmi.web.id,https://www.mahalaksmi.web.id
      - key: LOG_LEVEL
        value: INFO
    autoDeploy: true

  - type: redis
    name: mahalakshmi_redis
    plan: free
    maxmemoryPolicy: allkeys-lru

databases:
  - name: mahalakshmi_db
    plan: free
    databaseName: maha_lakshmi
    user: mahalakshmi
