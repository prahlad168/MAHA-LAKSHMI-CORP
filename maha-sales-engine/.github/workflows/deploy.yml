name: Production CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy pytest bandit
      
      - name: Lint
        run: ruff check .
      
      - name: Type check
        run: mypy .
      
      - name: Run tests
        run: pytest tests/ -v --tb=short
      
      - name: Security scan
        run: bandit -r .
        continue-on-error: true
      
      - name: Build Docker image
        run: docker build -t maha-sales-engine:${{ github.sha }} .
      
      - name: Run database migrations
        run: python deploy/migrations/runner.py
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-results/
            coverage/

  cd:
    needs: ci
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./maha-sales-engine
          file: ./maha-sales-engine/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/maha-sales-engine:latest
            ghcr.io/${{ github.repository }}/maha-sales-engine:${{ github.sha }}
      
      - name: Deploy to production
        run: |
          echo "Deployment step - configure your deployment target"
          # Example: kubectl apply, ssh deploy, etc.
      
      - name: Health check
        run: |
          echo "Running post-deployment health check"
          sleep 30
          curl -f http://localhost:8000/health || exit 1
