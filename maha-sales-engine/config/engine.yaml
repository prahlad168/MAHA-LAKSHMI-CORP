engine:
  name: "MAHA Sales Engine V1"
  version: "1.0.0"
  node_id: "node-1"
  environment: "production"
  debug: false

dashboard:
  url: "https://mahalaksmi.web.id"
  api_endpoint: "/api/v1/sales-node/report"
  heartbeat_interval: 60
  report_interval: 86400
  timeout: 30

sales:
  daily_leads_target: 50
  daily_outreach_target: 100
  daily_revenue_target_usd: 100
  products:
    - "social-media-kit"
    - "seo-bundle"
    - "whatsapp-marketing"
    - "landing-template"
    - "business-kit"

channels:
  email:
    enabled: true
    max_per_day: 30
    smtp_host: "smtp.gmail.com"
    smtp_port: 587
    username: "your-email@gmail.com"
    password: "your-app-password"
  whatsapp:
    enabled: true
    max_per_day: 20
    api_url: "https://api.whatsapp.com"
    token: ""
  linkedin:
    enabled: false
    max_per_day: 15
    api_url: "https://api.linkedin.com"
    token: ""

database:
  path: "./db/maha_sales_engine.db"
  backup_interval: 86400
  retention_days: 90

logging:
  level: "INFO"
  max_size_mb: 10
  backup_count: 5
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

security:
  api_key: ""
  encryption_key: ""
  cert_path: ""
  key_path: ""
  ca_path: ""

marketplaces:
  gumroad:
    enabled: true
    api_key: ""
  shopify:
    enabled: true
    api_key: ""
    store_url: ""
  etsy:
    enabled: false
    api_key: ""

ai:
  enabled: true
  model: "gpt-4"
  temperature: 0.7
  max_tokens: 2000

windows_service:
  service_name: "MahaSalesEngine"
  display_name: "MAHA Sales Engine V1"
  description: "Autonomous Digital Sales Engine for MAHA LAKSHMI HOLDINGS"
