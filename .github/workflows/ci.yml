name: MAHA CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: maha-sales-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: maha-sales-engine/requirements.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff
      - name: Lint
        run: ruff check .
      - name: Unit and integration tests
        run: pytest -q

  security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: maha-sales-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install audit tool
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
      - name: Dependency audit
        run: pip-audit -r requirements.txt

  runtime-smoke:
    runs-on: ubuntu-latest
    needs: [tests, security]
    defaults:
      run:
        working-directory: maha-sales-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Import smoke test
        env:
          PYTHONPATH: .
        run: |
          python -c "from agent_runtime import Task, EventLog, AgentStore, Director"
          python -c "from research.agent_v2 import ResearchAgentV2"
          python -c "from agent_runtime.intelligence import CRMIntelligence"
          python -c "from research.recheck import ResearchRecheckAgent"

  staging-smoke:
    if: github.ref == 'refs/heads/staging' && github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [runtime-smoke]
    steps:
      - name: Staging health check
        env:
          STAGING_HEALTH_URL: ${{ secrets.STAGING_HEALTH_URL }}
        run: |
          test -n "$STAGING_HEALTH_URL"
          curl --fail --silent --show-error --retry 5 --retry-delay 5 "$STAGING_HEALTH_URL"

  production-smoke:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [runtime-smoke]
    steps:
      - name: Production health check
        env:
          PRODUCTION_HEALTH_URL: ${{ secrets.PRODUCTION_HEALTH_URL }}
        run: |
          test -n "$PRODUCTION_HEALTH_URL"
          curl --fail --silent --show-error --retry 5 --retry-delay 5 "$PRODUCTION_HEALTH_URL"
