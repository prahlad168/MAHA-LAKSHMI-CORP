name: MAHA CI

on:
  workflow_dispatch:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: maha-sales-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: maha-sales-engine/requirements.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff
      - name: Critical runtime validation
        env:
          PYTHONPATH: .
        run: |
          python -m compileall -q agent_runtime research
          ruff check agent_runtime research --select E9,F821
      - name: Unit and integration tests
        env:
          PYTHONPATH: .
        run: pytest -q tests

  security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: maha-sales-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install audit tool
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
      - name: Dependency audit
        run: |
          pip-audit -r requirements.txt -f json -o pip-audit.json || true
      - name: Upload dependency audit report
        uses: actions/upload-artifact@v4
        with:
          name: maha-pip-audit
          path: maha-sales-engine/pip-audit.json
          if-no-files-found: error

  runtime-smoke:
    runs-on: ubuntu-latest
    needs: [tests, security]
    defaults:
      run:
        working-directory: maha-sales-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Runtime import smoke
        env:
          PYTHONPATH: .
        run: |
          python -c "from agent_runtime import Task, EventLog, AgentStore, Director"
          python -c "from research.agent_v2 import ResearchAgentV2"
          python -c "from agent_runtime.intelligence import CRMIntelligence"
          python -c "from research.recheck import ResearchRecheckAgent"

  api-smoke:
    runs-on: ubuntu-latest
    needs: [tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Start API
        env:
          PYTHONPATH: .
        run: |
          nohup uvicorn backend.main:app --host 127.0.0.1 --port 8000 > /tmp/maha-api.log 2>&1 &
          echo $! > /tmp/maha-api.pid
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health > /tmp/health.json; then break; fi
            sleep 2
          done
          test -s /tmp/health.json
          python - <<'PY'
          import json
          with open('/tmp/health.json', encoding='utf-8') as f:
              payload = json.load(f)
          assert payload.get('status') == 'healthy', payload
          PY
      - name: Stop API
        if: always()
        run: |
          if test -f /tmp/maha-api.pid; then kill "$(cat /tmp/maha-api.pid)" || true; fi
          if test -f /tmp/maha-api.log; then cat /tmp/maha-api.log; fi

  ci-gate:
    runs-on: ubuntu-latest
    needs: [tests, security, runtime-smoke, api-smoke]
    steps:
      - run: echo "MAHA self-contained CI gate passed"
